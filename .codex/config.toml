# poly-maker project Codex configuration

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[agents]
enabled = true

# Architect / Worker / Reviewer.
# This is only a thread cap.
# AGENTS.md requires logical serial execution.
max_concurrent_threads_per_session = 3

# Prevent uncontrolled recursive delegation.
# Specialist agents must not spawn additional agents anyway.
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "high"
