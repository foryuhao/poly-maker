# CONSERVATIVE live-test config (Fable autonomous run, ~$50 mandate).
[wallet]
chain_id = 137
signature_type = 3
clob_host = "https://clob.polymarket.com"
gamma_host = "https://gamma-api.polymarket.com"
data_api_host = "https://data-api.polymarket.com"
polygon_rpc = "https://polygon-bor-rpc.publicnode.com"

[engine]
debounce_ms = 250
reconcile_interval_s = 20
catalog_refresh_s = 300
heartbeat = true
heartbeat_interval_s = 5
journal = true
loop = "uvloop"

[risk]
max_total_exposure_usdc = 40.0       # hard ceiling on deployed capital
max_event_group_loss_usdc = 30.0
max_market_notional_usdc = 15.0      # per-market cap
daily_loss_kill_usdc = 12.0          # stop trading if we lose ~$12
ws_stale_halt_s = 8.0
user_ws_blind_halt_s = 12.0
heartbeat_halt_failures = 3
max_order_error_rate = 0.25

[execution]
rate_budget_fraction = 0.15
post_only = true
max_orders_per_batch = 15

[rdp_sm]
normal_entry_mode = "obi_v1"
base_size = "5"
target_delta = "1"
matched_remaining_tolerance_shares = 0.1

[rdp_sm.ba]
out_of_order_tolerance_ms = 10.0

[rdp_sm.cooldown]
max_sec = 20.0
loss_sec_per_dollar = 100.0

[rdp_sm.repair]
# Switch to opposite_ba_v1 to use the independent BA exit settings below.
policy = "hd_tp_sl_v1"
delta_limit = "5"
review_sec = 2.0
cutoff_sec = 240.0

[rdp_sm.repair.opposite_ba]
out_of_order_tolerance_ms = 10.0
min_sell_shares = "5"
min_depletion_shares = "5"
min_refill_shares = "5"
observation_sec = 0.75
signal_lifetime_sec = 3.0
max_sell_age_ms = 500.0
max_book_age_ms = 200.0
max_pair_skew_ms = 200.0
max_entry_age_ms = 1000.0

[rdp_sm.repair.opposite_ba.network]
post_budget_floor_ms = 750.0
min_live_budget_ms = 500.0
max_cancel_rtt_ms = 750.0

[rdp_sm.repair.abandon_high_entry]
enabled = true
min_elapsed_sec = 120.0
entry_price_threshold = "0.80"

[rdp_sm.repair.path]
# Independent exit controls; both false holds residual Delta without repair.
tp_enabled = true
sl_enabled = true
tp_profit_rate = "0.002"
shock_window_sec = 2.0
shock_max_age_sec = 3.0
shock_min_ticks = 2
shock_z = 1.5
drawdown_per_share = "0.06"
# Execution acceptance for supervised live testing; this is not EV validation.
calibration_status = "REPLAY_VALIDATED"
parameter_reference = "docs/development/REPAIR_PARAMETER_PROPOSAL_20261019.md"
validation_reference = "docs/development/reviews/20261019_sl_execution_recovery_fix/validation.json"

[rdp_sm.obi]
# Consecutive same-direction depth signals, counted separately in [0,60) and [60,120).
normal_confirmations_before_60 = 2
normal_confirmations_from_60 = 3
# Historical field name: individual slow-request threshold; p95 is diagnostic only.
max_rtt_p95_ms = 500.0
network_recent_window_sec = 5.0
network_slow_sample_count = 3
network_slow_trigger_count = 2
network_pause_sec = 2.0
network_max_pause_sec = 8.0
network_probe_interval_sec = 0.5

[rdp_sm.sync_observe]
enabled = true
use_for_execution = true
order_interval_s = 1.0
account_interval_s = 2.0
output_dir = "research_outputs/periodic_sync"

[paths]
db = "livecfg/state.db"
journal_dir = "livecfg/journal"
log_dir = "livecfg/logs"
